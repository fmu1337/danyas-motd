name: build-pages
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: build-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python pages.py
      - name: Commit if changed
        run: |
          git config user.name "motd-bot"
          git config user.email "motd-bot@users.noreply.github.com"
          git add page
          if ! git diff --cached --quiet; then
            git commit -m "auto: refresh stats"
            git push
          fi
